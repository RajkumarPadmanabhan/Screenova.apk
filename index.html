<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <title>Netflix oh</title>
  <meta name="description" content="Netflix oh turns a folder of movies and series on your device into a library you can browse and play.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=13">
</head>
<body class="skin-netflix">
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/">
        <span id="brand-name">Netflix oh</span>
      </a>
      <nav class="desk-nav" aria-label="Primary">
        <a href="#/" data-nav="home"><span data-label="home">Home</span></a>
        <a href="#/series" data-nav="series"><span data-label="series">TV Shows</span></a>
        <a href="#/movies" data-nav="movies"><span data-label="movies">Movies</span></a>
        <a href="#/list" data-nav="list"><span data-label="list">My List</span></a>
      </nav>
      <div class="top-actions">
        <label class="search">
          <span class="sr">Search</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input id="search" type="search" placeholder="Titles, people, genres" autocomplete="off">
        </label>
        <button id="sync" class="icon sync" type="button" data-act="refresh" aria-label="Refresh library" title="Refresh library">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.3"></path><path d="M21 3.5V8h-4.5"></path></svg>
        </button>
        <a class="icon mobile-search" href="#/search" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        </a>
        <button class="icon folder" type="button" data-act="choose" aria-label="Choose folder">
          <svg viewBox="0 0 24 24"><path d="M3 7.5h6l2 2H21V19a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19V7.5z"></path><path d="M3 7.5V6A1.5 1.5 0 0 1 4.5 4.5H9l2 2"></path></svg>
        </button>
        <button id="logout" class="logout" type="button" data-act="logout" hidden>Sign Out</button>
        <a class="avatar" href="#/library" aria-label="Library">N</a>
      </div>
    </header>
    <main id="view"></main>
    <nav class="tabbar" aria-label="Mobile">
      <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"></path><path d="M7 10.5V20h10v-9.5"></path></svg><span data-label="home">Home</span></a>
      <a href="#/search" data-nav="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span data-label="search">Search</span></a>
      <a href="#/library" data-nav="library"><svg viewBox="0 0 24 24"><path d="M12 4v10"></path><path d="M8 10l4 4 4-4"></path><path d="M5 20h14"></path></svg><span data-label="library">Downloads</span></a>
      <a href="#/list" data-nav="list"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"></circle><path d="M5.5 19.5c1.2-3 3.4-4.5 6.5-4.5s5.3 1.5 6.5 4.5"></path></svg><span data-label="list">My List</span></a>
    </nav>
  </div>
  <div id="player" class="player" hidden></div>
  <div id="toast" class="toast" role="status"></div>
  <input id="folder-input" type="file" webkitdirectory directory multiple hidden>
  <input id="sub-file" type="file" accept=".srt,.vtt,.ass,.ssa,text/vtt,application/x-subrip" hidden>
  <script type="module" src="js/app.js?v=14"></script>
</body>
</html>
